name: Render hekaya

# Sister workflow to "Render day" for the HEKAYA slow-storytelling track.
# One-tap from the GitHub mobile app, same as render-day.
# Open the app -> this repo -> Actions -> "Render hekaya" -> Run workflow.
# ~30 min later the 6 hekaya reels + captions are in the
# "Photonect HEKAYA / <date>" subfolder of the existing Photonect Drive parent.
#
# IMPORTANT: this workflow NEVER touches data/posts/ -- it only renders
# data/hekaya/ slugs. NEWS and HEKAYA never share a render run.

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to render (YYYY-MM-DD). Blank = today (UTC).'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install system dependencies (ffmpeg, fonts, Chrome deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg fontconfig fonts-noto fonts-noto-cjk \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libgbm1 libasound2t64 libpangocairo-1.0-0

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: my-video/package-lock.json

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install Pillow numpy google-api-python-client google-auth

      - name: Install Remotion dependencies
        working-directory: my-video
        run: npm ci

      - name: Resolve target date (validate + default to today)
        id: date
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          if [ -z "$INPUT_DATE" ]; then
            RESOLVED="$(date -u +%Y-%m-%d)"
          else
            RESOLVED="$INPUT_DATE"
          fi
          if ! [[ "$RESOLVED" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::invalid date $RESOLVED -- must match YYYY-MM-DD"
            exit 1
          fi
          echo "value=$RESOLVED" >> "$GITHUB_OUTPUT"

      - name: Stage hand-picked HEKAYA media into my-video/public
        env:
          DATE_ARG: ${{ steps.date.outputs.value }}
        run: |
          set -e
          SRC="cloud-media/hekaya/$DATE_ARG"
          DST="my-video/public/images/hekaya"
          if [ ! -d "$SRC" ]; then
            echo "::error::no hekaya cloud-media for $DATE_ARG (expected $SRC)"
            exit 1
          fi
          mkdir -p "$DST"
          for slug_dir in "$SRC"/*/; do
            slug="$(basename "$slug_dir")"
            mkdir -p "$DST/$slug"
            cp "$slug_dir"* "$DST/$slug/"
          done
          echo "staged $(ls "$SRC" | grep -v _used_ids | wc -l) hekaya slugs"
          ls "$DST" | grep "^$DATE_ARG" || true

      - name: Verify Suno music tracks present
        env:
          DATE_ARG: ${{ steps.date.outputs.value }}
        run: |
          set -e
          missing=0
          for slug_dir in data/hekaya/$DATE_ARG-*/; do
            [ -d "$slug_dir" ] || continue
            audio_rel=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['audioBed'])" "$slug_dir.meta/props.json")
            full="my-video/public/$audio_rel"
            if [ ! -f "$full" ]; then
              echo "  MISSING audio: $full (for $(basename $slug_dir))"
              missing=$((missing+1))
              continue
            fi
            bytes=$(stat -c%s "$full")
            if [ "$bytes" -lt 100000 ]; then
              echo "  TINY audio ($bytes bytes): $full"
              missing=$((missing+1))
            fi
          done
          if [ $missing -gt 0 ]; then
            echo "::error::$missing Suno tracks missing -- run automation/scripts/generate-suno-music.py locally and commit my-video/public/audio/hekaya/"
            exit 1
          fi
          echo "all Suno tracks verified"

      - name: Render hekaya slate
        env:
          MYVIDEO: ${{ github.workspace }}/my-video
          DATE_ARG: ${{ steps.date.outputs.value }}
        run: bash generate-hekaya.sh "$DATE_ARG"

      - name: Write Drive OAuth credentials to disk
        env:
          DRIVE_OAUTH_JSON: ${{ secrets.DRIVE_OAUTH_JSON }}
        run: |
          mkdir -p automation/secrets
          printf '%s' "$DRIVE_OAUTH_JSON" > automation/secrets/drive-creds.json
          python3 -c "import json; json.load(open('automation/secrets/drive-creds.json'))"

      - name: Upload HEKAYA renders + captions to Google Drive
        env:
          DRIVE_PARENT_FOLDER_ID: ${{ secrets.DRIVE_PARENT_FOLDER_ID }}
          DATE_ARG: ${{ steps.date.outputs.value }}
        run: |
          python3 automation/scripts/upload-hekaya-to-drive.py \
            --date "$DATE_ARG" \
            --parent-id "$DRIVE_PARENT_FOLDER_ID" \
            --credentials automation/secrets/drive-creds.json

      - name: Upload QA artefacts to workflow run
        if: always()
        env:
          DATE_ARG: ${{ steps.date.outputs.value }}
        run: |
          echo "artefact_path=/tmp/photonect-hekaya-$DATE_ARG" >> "$GITHUB_ENV"
          echo "artefact_name=qa-hekaya-$DATE_ARG" >> "$GITHUB_ENV"

      - name: Publish QA artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artefact_name }}
          path: ${{ env.artefact_path }}
          if-no-files-found: ignore
          retention-days: 14

      - name: Shred Drive credentials JSON
        if: always()
        run: rm -f automation/secrets/drive-creds.json
