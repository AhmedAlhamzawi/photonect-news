name: Render day

# One-tap trigger from the GitHub mobile app.
# Open the app → this repo → Actions → "Render day" → Run workflow.
# ~30 min later the 6 videos + 6 captions are in Google Drive.

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to render (YYYY-MM-DD). Blank = today (UTC).'
        required: false
        type: string
        default: ''
      trial:
        description: 'Optional trial label (e.g. "Trial 2") for leap-mandate A/B comparison runs. Leaves Trial 1 at root, puts this run inside a subfolder.'
        required: false
        type: string
        default: ''
      auto_post:
        description: 'Auto-post the slate to Instagram + TikTok via upload-post (only fires if UPLOAD_POST_API_KEY secret is set). Uncheck to render+Drive only.'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      # Promoted to job level so the auto-post step's `if:` can read it.
      # Empty when the secret isn't set → the post step is skipped (safe).
      UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install system dependencies (ffmpeg, fonts, Chrome deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg fontconfig fonts-noto fonts-noto-cjk \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libgbm1 libasound2t64 libpangocairo-1.0-0

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: my-video/package-lock.json

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install Pillow numpy google-api-python-client google-auth

      - name: Install Remotion dependencies
        working-directory: my-video
        run: npm ci

      - name: Resolve target date (validate + default to today)
        id: date
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          if [ -z "$INPUT_DATE" ]; then
            RESOLVED="$(date -u +%Y-%m-%d)"
          else
            RESOLVED="$INPUT_DATE"
          fi
          if ! [[ "$RESOLVED" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::invalid date '$RESOLVED' -- must match YYYY-MM-DD"
            exit 1
          fi
          echo "value=$RESOLVED" >> "$GITHUB_OUTPUT"

      - name: Stage hand-picked media into my-video/public
        env:
          DATE_ARG: ${{ steps.date.outputs.value }}
        run: |
          set -e
          SRC="cloud-media/$DATE_ARG"
          DST="my-video/public/images/news"
          if [ ! -d "$SRC" ]; then
            echo "::error::no cloud-media for $DATE_ARG (expected $SRC)"
            exit 1
          fi
          mkdir -p "$DST"
          for slug_dir in "$SRC"/*/; do
            slug="$(basename "$slug_dir")"
            mkdir -p "$DST/$slug"
            cp "$slug_dir"* "$DST/$slug/"
          done
          echo "staged $(ls "$SRC" | wc -l) slugs:"
          ls "$DST" | grep "^$DATE_ARG" || true

      - name: Render slate
        env:
          MYVIDEO: ${{ github.workspace }}/my-video
          DATE_ARG: ${{ steps.date.outputs.value }}
        run: bash generate-daily.sh "$DATE_ARG"

      - name: Write Drive OAuth credentials to disk
        env:
          DRIVE_OAUTH_JSON: ${{ secrets.DRIVE_OAUTH_JSON }}
        run: |
          mkdir -p automation/secrets
          printf '%s' "$DRIVE_OAUTH_JSON" > automation/secrets/drive-creds.json
          python3 -c "import json; json.load(open('automation/secrets/drive-creds.json'))"

      - name: Upload renders + captions to Google Drive
        env:
          DRIVE_PARENT_FOLDER_ID: ${{ secrets.DRIVE_PARENT_FOLDER_ID }}
          DATE_ARG: ${{ steps.date.outputs.value }}
          TRIAL_LABEL: ${{ inputs.trial }}
        run: |
          set -e
          ARGS=(--date "$DATE_ARG" --parent-id "$DRIVE_PARENT_FOLDER_ID" --credentials automation/secrets/drive-creds.json)
          if [ -n "$TRIAL_LABEL" ]; then
            ARGS+=(--trial-label "$TRIAL_LABEL")
          fi
          python3 automation/scripts/upload-to-drive.py "${ARGS[@]}"

      - name: Auto-post the slate to Instagram + TikTok
        # Fires only when the API key secret exists AND auto_post wasn't unchecked.
        # No key → env is empty → step skipped → workflow stays green.
        if: ${{ env.UPLOAD_POST_API_KEY != '' && inputs.auto_post }}
        env:
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
          UPLOAD_POST_USER: ${{ secrets.UPLOAD_POST_USER }}
          DATE_ARG: ${{ steps.date.outputs.value }}
        run: |
          python3 automation/scripts/post-to-uploadpost.py \
            --date "$DATE_ARG" \
            --user "$UPLOAD_POST_USER" \
            --platforms instagram,tiktok

      - name: Upload QA artefacts to workflow run
        if: always()
        env:
          DATE_ARG: ${{ steps.date.outputs.value }}
        run: |
          echo "artefact_path=/tmp/photonect-$DATE_ARG" >> "$GITHUB_ENV"
          echo "artefact_name=qa-$DATE_ARG" >> "$GITHUB_ENV"

      - name: Publish QA artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artefact_name }}
          path: ${{ env.artefact_path }}
          if-no-files-found: ignore
          retention-days: 14

      - name: Shred Drive credentials JSON
        if: always()
        run: rm -f automation/secrets/drive-creds.json
